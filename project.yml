name: PipServerTime
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PipServerTime:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - PipServerTimeTests
    sources:
      - PipServerTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pipservertime
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PipServerTime/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PipServerTime/Resources/Info.plist
      properties:
        CFBundleDisplayName: 서버시간 PiP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 집중 화면을 가로로 크게 보기 위해 가로 방향 허용
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # PiP 는 "Audio, AirPlay, and Picture in Picture" 백그라운드 모드가 필요합니다.
        UIBackgroundModes:
          - audio
        # 사용자가 임의의 사이트(http 포함)를 넣을 수 있도록 허용
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  PipServerTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PipServerTimeTests
    dependencies:
      - target: PipServerTime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pipservertime.tests
